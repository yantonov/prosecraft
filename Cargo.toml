[package]
name = "prosecraft"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Yury Antonov"]

[dependencies]
# Text only: the default `image-data` feature would pull the whole `image` crate (PNG,
# TIFF, JPEG codecs) for a clipboard this app only ever moves prose through.
arboard = { version = "3.6", default-features = false }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
